<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff2020" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Cursor’s preview runs in Electron and often looks slightly smaller than system Chrome
      (Windows DPI / Chrome font defaults). Tag standalone browsers before paint so CSS can match.
    -->
    <script>
      (function () {
        try {
          if (!/Electron/i.test(navigator.userAgent)) {
            document.documentElement.dataset.appShell = "browser";
          }
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-render-blocking fonts: load async with display=swap to avoid blocking FCP/LCP -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Big+Shoulders+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Big+Shoulders+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>
    <title>Urban Hub Student Accommodation Preston</title>
    <meta name="description" content="Modern student accommodation in Preston. Book your studio apartment for the academic year. Premium amenities and convenient location." />

    <meta name="author" content="Urban Hub" />
    <link rel="canonical" href="https://urbanhub.uk/" />

    <meta property="og:title" content="Urban Hub | Student Accommodation Preston" />
    <meta property="og:description" content="Modern student accommodation in Preston. Book your studio apartment for the academic year. Premium amenities and convenient location." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://urbanhub.uk/" />
    <meta property="og:locale" content="en_GB" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />

    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@stucommsuk" />
    <meta name="twitter:image" content="/favicon.png" />
  </head>

</html>
